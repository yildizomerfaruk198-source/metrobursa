.stan-idx{width:19px;height:19px;border-radius:50%;background:var(--bg);border:1px solid var(--bd);font-size:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--mut)}
.stan-val{font-family:var(--gf);font-weight:400;font-size:13.5px;white-space:nowrap}
.stan-bar{height:7px;background:var(--bd);border-radius:5px;overflow:hidden}
.stan-bar i{display:block;height:100%;border-radius:5px}
.stan-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--mut)}
.stan-srcs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stan-tag{padding:1px 6px;border-radius:7px;background:var(--bg);border:1px solid var(--bd);font-weight:700;font-size:10px}
.stan-tag.bot{background:rgba(239,68,68,.14);color:#dc2626;border-color:rgba(239,68,68,.35)}
.stan-tag.weak{background:rgba(148,163,184,.16);color:var(--mut)}
.stan-acts{display:flex;gap:4px;align-items:center}
.stan-acts button{padding:3px 7px;font-size:10.5px;font-weight:700;border-radius:8px}
.sched-box{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin:8px 0}
.sched-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:7px}
.sched-24h{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px;padding:6px 8px;background:var(--card);border:1px solid var(--bd);border-radius:11px}
.sched-slot{display:flex;flex-direction:column;align-items:center;gap:3px}
.sched-slot-bar{width:100%;height:20px;background:var(--bg);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden;border:1px solid var(--bd)}
.sched-slot-bar i{display:block;width:100%;background:linear-gradient(180deg,#38bdf8,#1d6fd1);border-radius:3px;transition:height .2s ease}
.sched-slot.pk .sched-slot-bar i{background:linear-gradient(180deg,#fb923c,#e63946)}
.sched-slot small{font-size:9.5px;color:var(--mut);font-weight:700}
.sched-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sched-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:7px 9px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card)}
.sched-btn.on{border-color:#0ea5e9;background:rgba(14,165,233,.11)}
.sched-btn b{font-size:12px}.sched-btn small{font-size:10px;color:var(--mut);line-height:1.25}
.gc-sched{background:rgba(14,165,233,.12)!important;color:#0284c7;font-weight:700}
:root[data-theme="dark"] .gc-sched{color:#38bdf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gc-sched{color:#38bdf8}}
#mvst{padding:6px 10px;font-size:12.5px;font-weight:700}
#mvst.on{background:#0ea5e9;color:#fff;border-color:transparent}
#mvbar{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(14,165,233,.94);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:7px 12px;font-size:12.5px;font-weight:700;z-index:4;box-shadow:0 8px 24px rgba(14,165,233,.35);max-width:calc(100% - 20px)}
#mvbar[hidden]{display:none}
#mvbar button{background:rgba(15,23,42,.35);color:#fff;border:0;border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:700}
.dk-wp-btn{padding:4px 9px;font-size:11.5px;font-weight:700}
.dk-wp-btn.on{background:#0ea5e9;color:#fff;border-color:transparent}
@media(max-width:600px){.plan-grid,.cn-opts,.sched-grid{grid-template-columns:1fr}}
